[pytest]
pythonpath = .
testpaths =
    tests
    scripts
markers =
    p0: P0 smoke coverage
    p1: P1 coverage
    p2: P2 coverage
    ui_test: governed UI automation case
    r0: read-only UI case
    r1: bounded non-business-write UI case
    r2: visible UI write case requiring current-run approval
    case_id(value): stable Source Case identifier
    branch_id(value): stable Source Case branch identifier
